name: Phase 0 checks

on:
  pull_request:
    paths:
      - ".github/workflows/phase0-ci.yml"
      - "convex/**"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "*.config.*"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sengapp-phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the PR
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test domain and access rules
        run: npm test

      - name: Build app without real OAuth credentials
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile browser flows
        run: npm run test:e2e

      - name: Keep browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3
