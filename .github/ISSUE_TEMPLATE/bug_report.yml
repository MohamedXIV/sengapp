name: Bug report
description: Report reproducible behavior in an available Sengapp build or repository asset.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Please remove personal information and secrets from reproduction steps. For security vulnerabilities, follow SECURITY.md instead."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
      placeholder: "When I..., the app..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include browser/device and revision when available.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private messages, credentials and personal data from this report.
          required: true
